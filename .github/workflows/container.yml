name: Container CI and edge

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/publish.yml
    with:
      channel: edge
      ref: ${{ github.sha }}
      publish: ${{ github.event_name != 'pull_request' && github.repository == 'aserper/OnRecord' && github.ref == 'refs/heads/master' }}
    secrets: inherit

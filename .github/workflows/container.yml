name: Build and publish container

on:
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - "deploy/**"
      - "argocd-application.yaml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @your_spotify/server test
      - run: pnpm --filter @your_spotify/server typecheck
      - run: pnpm --filter @your_spotify/client typecheck
      - run: pnpm --filter @your_spotify/server build
      - run: pnpm --filter @your_spotify/client build

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/your_spotify
          tags: |
            type=sha,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image digest for ArgoCD
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/your_spotify@${{ steps.build.outputs.digest }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          manifest = Path("deploy/your-spotify.yaml")
          content = manifest.read_text()
          lines = content.splitlines()
          matches = [
              index
              for index, line in enumerate(lines)
              if line.strip().startswith("image: ghcr.io/aserper/your_spotify@")
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one deploy image, found {len(matches)}")
          indentation = lines[matches[0]][: len(lines[matches[0]]) - len(lines[matches[0]].lstrip())]
          lines[matches[0]] = f"{indentation}image: {os.environ['IMAGE']}"
          manifest.write_text("\n".join(lines) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/your-spotify.yaml
          if git diff --cached --quiet; then
            echo "Manifest already references this digest"
            exit 0
          fi
          git commit -m "deploy: your_spotify ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:master

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: onrecord-mongo-pv
  labels:
    app.kubernetes.io/name: onrecord
    app.kubernetes.io/instance: onrecord
    app.kubernetes.io/part-of: media-stack
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.1.124
    # Unchanged from the Your Spotify deployment: existing Mongo data,
    # cooldown file, and uploaded imports live here.
    path: /mnt/storage/media/containers/your-spotify/mongo

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onrecord-mongo-pvc
  labels:
    app.kubernetes.io/name: onrecord
    app.kubernetes.io/instance: onrecord
    app.kubernetes.io/part-of: media-stack
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onrecord
  labels:
    app.kubernetes.io/name: onrecord
    app.kubernetes.io/instance: onrecord
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: onrecord
      app.kubernetes.io/instance: onrecord
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onrecord
        app.kubernetes.io/instance: onrecord
        app.kubernetes.io/part-of: media-stack
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: mongo
        image: quay.io/mongodb/mongodb-community-server:6.0-ubi8
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      - name: onrecord
        image: ghcr.io/aserper/onrecord@sha256:8b33e80d9f1de3697c45eb999c32e1d90a55e2dda7b05004308fc690eab30b3c
        ports:
        - containerPort: 80
        - containerPort: 443
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        - name: APP_URL
          value: "https://onrecord.amit.wtf"
        - name: SPOTIFY_PUBLIC
          valueFrom:
            secretKeyRef:
              name: onrecord-spotify
              key: public
        - name: SPOTIFY_SECRET
          valueFrom:
            secretKeyRef:
              name: onrecord-spotify
              key: secret
        - name: CORS
          value: "https://onrecord.amit.wtf:443"
        - name: MONGO_ENDPOINT
          value: "mongodb://localhost:27017/your_spotify"
        - name: SPOTIFY_COOLDOWN_FILE
          value: "/hotfix/cooldown.json"
        - name: SPOTIFY_REQUEST_INTERVAL_MS
          value: "200"
        - name: COOKIE_VALIDITY_MS
          value: "2592000000"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: mongo-data
          mountPath: /hotfix
          subPath: .your-spotify-hotfix
        - name: mongo-data
          mountPath: /tmp/imports
          subPath: .your-spotify-hotfix/imports
      volumes:
      - name: mongo-data
        persistentVolumeClaim:
          claimName: onrecord-mongo-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: onrecord
  labels:
    app.kubernetes.io/name: onrecord
    app.kubernetes.io/instance: onrecord
    app.kubernetes.io/part-of: media-stack
spec:
  selector:
    app.kubernetes.io/name: onrecord
    app.kubernetes.io/instance: onrecord
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: https
    port: 443
    targetPort: 443

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: onrecord-tls
  labels:
    app.kubernetes.io/name: onrecord
    app.kubernetes.io/instance: onrecord
spec:
  secretName: onrecord-tls
  issuerRef:
    name: letsencrypt-live
    kind: ClusterIssuer
  dnsNames:
    - onrecord.amit.wtf

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: onrecord-legacy-tls
  labels:
    app.kubernetes.io/name: onrecord
    app.kubernetes.io/instance: onrecord
spec:
  secretName: onrecord-legacy-tls
  issuerRef:
    name: letsencrypt-live
    kind: ClusterIssuer
  dnsNames:
    - your-spotify.amit.wtf

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: onrecord
  labels:
    app.kubernetes.io/name: onrecord
    app.kubernetes.io/instance: onrecord
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "OnRecord"
    gethomepage.dev/description: "Personal listening statistics"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "mdi-record-vinyl"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`onrecord.amit.wtf`)
      kind: Rule
      services:
        - name: onrecord
          port: 80
      middlewares:
        - name: security-headers
          namespace: traefik
  tls:
    secretName: onrecord-tls

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: onrecord-http
  labels:
    app.kubernetes.io/name: onrecord
    app.kubernetes.io/instance: onrecord
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`onrecord.amit.wtf`)
      kind: Rule
      services:
        - name: onrecord
          port: 80
      middlewares:
        - name: redirect-https
          namespace: traefik

---
# Legacy host kept during the rename so existing bookmarks and the old
# Spotify redirect URI keep resolving. Remove after the Spotify dashboard
# lists the onrecord.amit.wtf redirect URI.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: onrecord-legacy
  labels:
    app.kubernetes.io/name: onrecord
    app.kubernetes.io/instance: onrecord
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`your-spotify.amit.wtf`)
      kind: Rule
      services:
        - name: onrecord
          port: 80
      middlewares:
        - name: security-headers
          namespace: traefik
  tls:
    secretName: onrecord-legacy-tls

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: onrecord-legacy-http
  labels:
    app.kubernetes.io/name: onrecord
    app.kubernetes.io/instance: onrecord
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`your-spotify.amit.wtf`)
      kind: Rule
      services:
        - name: onrecord
          port: 80
      middlewares:
        - name: redirect-https
          namespace: traefik

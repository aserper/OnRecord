---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: your-spotify-mongo-pv
  labels:
    app.kubernetes.io/name: your-spotify
    app.kubernetes.io/instance: your-spotify
    app.kubernetes.io/part-of: media-stack
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.1.124
    path: /mnt/storage/media/containers/your-spotify/mongo

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: your-spotify-mongo-pvc
  labels:
    app.kubernetes.io/name: your-spotify
    app.kubernetes.io/instance: your-spotify
    app.kubernetes.io/part-of: media-stack
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: your-spotify
  labels:
    app.kubernetes.io/name: your-spotify
    app.kubernetes.io/instance: your-spotify
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: your-spotify
      app.kubernetes.io/instance: your-spotify
  template:
    metadata:
      labels:
        app.kubernetes.io/name: your-spotify
        app.kubernetes.io/instance: your-spotify
        app.kubernetes.io/part-of: media-stack
    spec:
      containers:
      - name: mongo
        image: quay.io/mongodb/mongodb-community-server:6.0-ubi8
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      - name: your-spotify
        image: ghcr.io/aserper/your_spotify@sha256:93a5fdf5dcc635b0a92b214836d0cf59a11152bef03d736b3cc228787ff7899f
        ports:
        - containerPort: 80
        - containerPort: 443
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        - name: APP_URL
          value: "https://your-spotify.amit.wtf"
        - name: SPOTIFY_PUBLIC
          valueFrom:
            secretKeyRef:
              name: your-spotify-spotify
              key: public
        - name: SPOTIFY_SECRET
          valueFrom:
            secretKeyRef:
              name: your-spotify-spotify
              key: secret
        - name: CORS
          value: "https://your-spotify.amit.wtf:443"
        - name: MONGO_ENDPOINT
          value: "mongodb://localhost:27017/your_spotify"
        - name: SPOTIFY_COOLDOWN_FILE
          value: "/hotfix/cooldown.json"
        - name: SPOTIFY_REQUEST_INTERVAL_MS
          value: "200"
        - name: COOKIE_VALIDITY_MS
          value: "2592000000"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: mongo-data
          mountPath: /hotfix
          subPath: .your-spotify-hotfix
        - name: mongo-data
          mountPath: /tmp/imports
          subPath: .your-spotify-hotfix/imports
      volumes:
      - name: mongo-data
        persistentVolumeClaim:
          claimName: your-spotify-mongo-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: your-spotify
  labels:
    app.kubernetes.io/name: your-spotify
    app.kubernetes.io/instance: your-spotify
    app.kubernetes.io/part-of: media-stack
spec:
  selector:
    app.kubernetes.io/name: your-spotify
    app.kubernetes.io/instance: your-spotify
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: https
    port: 443
    targetPort: 443

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: your-spotify-tls
  labels:
    app.kubernetes.io/name: your-spotify
    app.kubernetes.io/instance: your-spotify
spec:
  secretName: your-spotify-tls
  issuerRef:
    name: letsencrypt-live
    kind: ClusterIssuer
  dnsNames:
    - your-spotify.amit.wtf

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: your-spotify
  labels:
    app.kubernetes.io/name: your-spotify
    app.kubernetes.io/instance: your-spotify
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Your Spotify"
    gethomepage.dev/description: "Personal Spotify Statistics"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "spotify"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`your-spotify.amit.wtf`)
      kind: Rule
      services:
        - name: your-spotify
          port: 80
      middlewares:
        - name: security-headers
          namespace: traefik
  tls:
    secretName: your-spotify-tls

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: your-spotify-http
  labels:
    app.kubernetes.io/name: your-spotify
    app.kubernetes.io/instance: your-spotify
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`your-spotify.amit.wtf`)
      kind: Rule
      services:
        - name: your-spotify
          port: 80
      middlewares:
        - name: redirect-https
          namespace: traefik
